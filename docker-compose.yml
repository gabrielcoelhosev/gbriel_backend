services:

  db:
    image: postgres:16
    restart: always
    container_name: blog_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gabriel_coelho
      POSTGRES_DB: gbriel_api

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    container_name: blog_adminer

    ports:
      - "8080:8080"

volumes:
  postgres_data: